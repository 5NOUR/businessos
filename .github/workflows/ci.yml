name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: businessos
          POSTGRES_PASSWORD: businessos
          POSTGRES_DB: businessos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U businessos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://businessos:businessos@localhost:5432/businessos_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      REFRESH_TOKEN_SECRET: test-refresh-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @businessos/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @businessos/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://businessos:businessos@localhost:5432/businessos_test?schema=public

      - name: Run lint
        run: pnpm --filter @businessos/api lint

      - name: Run typecheck
        run: pnpm --filter @businessos/api typecheck

      - name: Run tests
        run: pnpm --filter @businessos/api test

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm --filter @businessos/web lint

      - name: Run typecheck
        run: pnpm --filter @businessos/web typecheck

      - name: Run tests
        run: pnpm --filter @businessos/web test -- --run

  build:
    name: Build applications
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @businessos/api build

      - name: Build Web
        run: pnpm --filter @businessos/web build
